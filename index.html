<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terapia Renal Substitutiva no SUS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Painel de terapia renal substitutiva (diálise) no SUS organizado pelas 17 perguntas, com dados públicos do DATASUS.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: coluna única de leitura (máx. 1240 px); cabeçalho, abas fixas, filtros, régua R1 e cartões de resposta com a evidência abaixo. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#edf0f4; --ink:#14202b; --ink-2:#44525f; --muted:#5d6976;
  --line:#dce2e8; --line-2:#c3ccd5; --accent:#7a2e5c; --accent-soft:#f3e6ee; --on-accent:#ffffff;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a;
  --s1:#cde2fb; --s2:#86b6ef; --s3:#3987e5; --s4:#256abf; --s5:#104281;
  --d-neg2:#256abf; --d-neg1:#86b6ef; --d-mid:#e6e6e2; --d-pos1:#f19a99; --d-pos2:#c8302f;
  --st-good:#0ca30c; --st-warn:#fab219; --st-serious:#ec835a; --st-crit:#d03b3b;
  --flow-out:#6250d6; --flow-in:#c98500; --empty:#e9ecef; --hatch:#8d98a3;
  --font-sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:6px; --shadow:0 1px 2px rgba(20,32,43,.06); --scroll-sh:rgba(20,32,43,.22);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1319; --surface:#151b22; --surface-2:#1c242d; --ink:#e8edf2; --ink-2:#b3bec9; --muted:#8c98a5;
    --line:#26303a; --line-2:#37434f; --accent:#e29bc6; --accent-soft:#3a2333; --on-accent:#1a0f16;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70;
    --s1:#184f95; --s2:#256abf; --s3:#3987e5; --s4:#6da7ec; --s5:#b7d3f6;
    --d-neg2:#5598e7; --d-neg1:#1c5cab; --d-mid:#3a3f45; --d-pos1:#9e3a3a; --d-pos2:#e66767;
    --flow-out:#9085e9; --flow-in:#c98500; --empty:#222a33; --hatch:#7d8894;
    --shadow:none; --scroll-sh:rgba(232,237,242,.30); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1319; --surface:#151b22; --surface-2:#1c242d; --ink:#e8edf2; --ink-2:#b3bec9; --muted:#8c98a5;
  --line:#26303a; --line-2:#37434f; --accent:#e29bc6; --accent-soft:#3a2333; --on-accent:#1a0f16;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70;
  --s1:#184f95; --s2:#256abf; --s3:#3987e5; --s4:#6da7ec; --s5:#b7d3f6;
  --d-neg2:#5598e7; --d-neg1:#1c5cab; --d-mid:#3a3f45; --d-pos1:#9e3a3a; --d-pos2:#e66767;
  --flow-out:#9085e9; --flow-in:#c98500; --empty:#222a33; --hatch:#7d8894;
  --shadow:none; --scroll-sh:rgba(232,237,242,.30); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:30;background:var(--bg)}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3,h4{text-wrap:balance;margin:0;line-height:1.25}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
abbr[data-g],.g{text-decoration:underline dotted;text-underline-offset:3px;cursor:help;text-decoration-color:var(--muted)}

/* Cabeçalho */
header.top{padding-block:22px 10px;display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
header.top h1{font-size:clamp(22px,3.2vw,30px);font-weight:600;letter-spacing:-.01em}
header.top .sub{color:var(--ink-2);margin-top:4px;font-size:14px;max-width:72ch}
.mes-selo{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line-2);color:var(--ink-2);background:var(--surface);margin-top:8px}
.mes-selo.prov{background-image:repeating-linear-gradient(45deg,transparent 0 4px,color-mix(in srgb,var(--hatch) 35%,transparent) 4px 5px)}
.tema{display:flex;border:1px solid var(--line-2);border-radius:99px;overflow:hidden;background:var(--surface)}
.tema button{border:0;background:none;padding:5px 11px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.tema button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* Abas */
nav.abas{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));padding-inline:max(16px, env(safe-area-inset-left, 0px))}
nav.abas .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
nav.abas .wrap.mais-d{-webkit-mask-image:linear-gradient(to right,#000 82%,transparent);mask-image:linear-gradient(to right,#000 82%,transparent)}
nav.abas .wrap.mais-e.mais-d{-webkit-mask-image:linear-gradient(to right,transparent,#000 12%,#000 82%,transparent);mask-image:linear-gradient(to right,transparent,#000 12%,#000 82%,transparent)}
nav.abas .wrap.mais-e:not(.mais-d){-webkit-mask-image:linear-gradient(to right,transparent,#000 12%);mask-image:linear-gradient(to right,transparent,#000 12%)}
nav.abas button{flex:0 0 auto;border:0;background:none;padding:11px 12px 9px;cursor:pointer;color:var(--ink-2);font-weight:500;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
nav.abas button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.abas button .qs{font-weight:400;color:var(--muted);font-size:12px;margin-left:4px}

/* Filtros */
.filtros{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.filtros summary{cursor:pointer;font-weight:600;list-style:none;display:none}
.filtros summary::-webkit-details-marker{display:none}
.fgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px 12px}
.fgrid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2);min-width:0}
.fgrid select,.fgrid input{width:100%;min-width:0;padding:6px 8px;border:1px solid var(--line-2);border-radius:5px;background:var(--surface);font-size:13.5px}
.frow2{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:10px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 10px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-2);border-radius:99px;padding:2px 4px 2px 10px;font-size:12.5px;background:var(--surface-2);max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{border:0;background:none;cursor:pointer;width:22px;height:22px;border-radius:99px;display:grid;place-items:center;color:var(--ink-2)}
.chip button:hover{background:var(--line)}
.btn-link{border:0;background:none;color:var(--accent);cursor:pointer;padding:2px 4px;font-size:13px;text-decoration:underline}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:5px;padding:5px 10px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--ink-2)}

/* Resumo, régua R1, linha do tempo */
.resumo{margin-top:14px;font-size:16px;line-height:1.6;max-width:96ch}
.resumo b{font-weight:600}
.resumo .avisos{display:block;margin-top:6px;font-size:13.5px;color:var(--ink-2)}
.regua{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.regua .blocos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.regua .bl{padding:12px 14px;min-width:0}
.regua .bl + .bl{border-left:1px solid var(--line)}
.regua .k{font-size:clamp(20px,3vw,30px);font-weight:600;letter-spacing:-.01em;line-height:1.1}
.regua .u{font-size:13px;color:var(--ink-2);margin-top:2px}
.regua .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.regua .et-a{white-space:normal;display:inline-block;margin-top:4px}
.regua .rodape{border-top:1px solid var(--line);padding:8px 14px;font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:2px}
.regua .tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.linha-tempo{margin-top:10px}
.linha-tempo summary{cursor:pointer;font-size:13px;color:var(--ink-2)}

/* Jornada */
.jornada{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;margin-top:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.jornada button{all:unset;cursor:pointer;padding:10px 12px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0;position:relative}
.jornada button:first-child{border-left:0}
.jornada button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.jornada .et{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.jornada .nm{font-weight:600;font-size:14px}
.jornada .v{font-size:12.5px;color:var(--ink-2)}
.jornada .big{font-size:20px;font-weight:600;color:var(--ink);line-height:1.2;margin-top:2px}
.jornada button.on{background:var(--accent-soft)}
.jornada button.on .et{color:var(--ink-2)}
.jornada button.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--accent)}
.jornada.small .big{display:none}

/* Seções e cartões */
main{padding-bottom:40px}
.aba-sec{margin-top:22px}
.bloco-h{display:flex;align-items:baseline;gap:10px;margin:28px 0 10px;flex-wrap:wrap}
.bloco-h h2{font-size:20px;font-weight:600}
.cartao{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-top:14px;scroll-margin-top:60px;box-shadow:var(--shadow)}
.cartao .qh{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.qn{font-family:var(--font-mono);font-weight:500;font-size:13px;background:var(--ink);color:var(--bg);border-radius:4px;padding:1px 6px;flex:0 0 auto;margin-top:2px}
.cartao h3{font-size:17px;font-weight:600;flex:1 1 300px;min-width:0}
.resp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 24px;margin-top:10px;align-items:start}
.resp .frase{font-size:16px;line-height:1.55;max-width:75ch}
.resp .principal{text-align:right;min-width:0}
.resp .principal .k{font-size:28px;font-weight:600;line-height:1.1;letter-spacing:-.01em}
.resp .principal .u{font-size:13px;color:var(--ink-2)}
.meta-l{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);margin-top:10px}
.selo{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:4px;padding:1px 7px;border:1px solid var(--line-2)}
.selo.sim{color:var(--ink)}
.selo.parcial{color:var(--ink);background-image:repeating-linear-gradient(45deg,transparent 0 4px,color-mix(in srgb,var(--hatch) 30%,transparent) 4px 5px)}
.alerta{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:13.5px;color:var(--ink-2);background:var(--surface-2);border-radius:5px;padding:8px 10px;max-width:110ch}
.alerta svg{flex:0 0 auto;margin-top:2px}
.evid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.evid > .full{grid-column:1 / -1}

/* Quadros (gráficos) */
.quadro{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0;background:var(--surface)}
.quadro .qt{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;justify-content:space-between}
.quadro h4{font-size:14.5px;font-weight:600;min-width:0}
.quadro .tags{display:flex;flex-wrap:wrap;gap:4px}
.et-a{font-size:11px;border-radius:3px;padding:1px 6px;border:1px solid var(--line-2);color:var(--ink-2);white-space:normal;overflow-wrap:anywhere;max-width:100%;display:inline-block}
.tags{max-width:100%;min-width:0}
.et-a.filtrado{border-color:transparent;background:var(--surface-2)}
.et-a.acima{border-style:dashed}
.et-a.na{background-image:repeating-linear-gradient(45deg,transparent 0 4px,color-mix(in srgb,var(--hatch) 30%,transparent) 4px 5px)}
.et-a.pov{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.quadro .qb{margin-top:10px;min-width:0}
.quadro .qf{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;color:var(--muted)}
.nota{font-size:12.5px;color:var(--ink-2);margin-top:8px;max-width:100ch}
.carregando{color:var(--muted);font-size:13px;padding:14px 0}
.vazio-msg{color:var(--ink-2);font-size:13.5px;padding:10px;background:var(--surface-2);border-radius:5px}

/* contadores */
.conts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cont{border-left:3px solid var(--line-2);padding:4px 10px;min-width:0}
.cont .k{font-size:22px;font-weight:600;line-height:1.15}
.cont .u{font-size:12.5px;color:var(--ink-2)}
.cont .s{font-size:12px;color:var(--muted)}

/* barras HTML */
.bars{display:grid;grid-template-columns:minmax(90px,max-content) minmax(0,1fr) max-content;gap:5px 10px;align-items:center;font-size:13px}
.bars .lb{min-width:0;color:var(--ink-2);overflow-wrap:anywhere}
.bars .tr{height:12px;position:relative;min-width:0}
.bars .br{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;min-width:2px}
.bars .br.h{background-image:repeating-linear-gradient(45deg,transparent 0 3px,var(--hatch) 3px 4px);opacity:.75}
.bars .vl{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.bars .clk{cursor:pointer}
.bars .clk:hover{color:var(--accent)}
.st100{display:flex;gap:2px;height:16px;border-radius:4px;overflow:hidden}
.st100 > div{min-width:2px}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-2);margin-top:6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.leg i.ln{height:3px;border-radius:2px;vertical-align:3px}
.leg i.h{background-image:repeating-linear-gradient(45deg,transparent 0 2px,var(--hatch) 2px 3px)}
.medidor{display:grid;grid-template-columns:minmax(110px,max-content) minmax(0,1fr) max-content;gap:6px 10px;align-items:center;font-size:13px}
@media (max-width:480px){.medidor{grid-template-columns:minmax(80px,max-content) minmax(40px,1fr) max-content}.medidor .num .muted{display:block;font-size:11.5px}}
.medidor .tr{height:10px;background:var(--surface-2);border-radius:5px;position:relative;overflow:hidden}
.medidor .tr div{position:absolute;inset:0 auto 0 0;background:var(--c1);border-radius:5px}

/* Faixa */
.faixa{margin-top:4px}
.faixa .fx-nums{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-2)}
.faixa .fx-nums b{font-size:20px;color:var(--ink);font-weight:600;display:block}
.faixa svg{display:block;width:100%;height:28px;overflow:visible}

/* Tabelas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:5px;background:
  linear-gradient(to right,var(--surface) 30%,transparent) left/30px 100% no-repeat local,
  linear-gradient(to left,var(--surface) 30%,transparent) right/30px 100% no-repeat local,
  radial-gradient(farthest-side at 0 50%,var(--scroll-sh),transparent) left/12px 100% no-repeat scroll,
  radial-gradient(farthest-side at 100% 50%,var(--scroll-sh),transparent) right/12px 100% no-repeat scroll;background-color:var(--surface);max-height:min(75vh,720px);overflow-y:auto}
.tbl-dica{display:none;font-size:12px;color:var(--ink-2);margin-top:4px}
.tbl-dica.on{display:flex;gap:5px;align-items:center}
.eixo-nz{font-size:11.5px;color:var(--muted);margin-top:2px}
.jornada .per{font-size:11.5px;color:var(--muted);margin-top:2px}
.jornada button.prov{background-image:repeating-linear-gradient(45deg,transparent 0 6px,color-mix(in srgb,var(--hatch) 16%,transparent) 6px 7px)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 9px;min-width:56px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--ink-2);background:var(--surface-2);white-space:normal;vertical-align:bottom;max-width:200px;position:sticky;top:0;z-index:1}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--ink)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.n{white-space:nowrap}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--surface-2)}
.pager{display:flex;gap:8px;align-items:center;font-size:12.5px;margin-top:6px;flex-wrap:wrap}
.tsearch{width:min(320px,100%);padding:6px 8px;border:1px solid var(--line-2);border-radius:5px;background:var(--surface);margin-bottom:6px}

/* status chip */
.stc{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:12.5px}
.stc svg{flex:0 0 auto}
.rec{display:inline-block;font-size:11.5px;border:1px solid var(--line-2);border-radius:99px;padding:0 7px;margin:1px 2px 1px 0;white-space:nowrap}

/* SVG */
svg text{fill:var(--ink-2);font-family:var(--font-sans);font-size:11px}
.regua.prov .blocos{background-image:repeating-linear-gradient(45deg,transparent 0 6px,color-mix(in srgb,var(--hatch) 14%,transparent) 6px 7px)}
.selo-prov{display:inline-block;font-size:11px;font-weight:600;border:1px dashed var(--line-2);border-radius:3px;padding:0 6px;margin-left:6px;color:var(--ink-2);vertical-align:2px}
.idx-row .pf{font-size:12px;color:var(--muted);margin-top:3px;display:block}
.ocup-leg{display:grid;gap:3px;font-size:13px;margin-top:4px}
.ocup-leg div{display:grid;grid-template-columns:22px minmax(0,1fr) max-content;gap:6px;align-items:baseline}
.ocup-leg .nb{font-family:var(--font-mono);font-size:11.5px;font-weight:600;text-align:center;border:1px solid var(--line-2);border-radius:3px}
.ocup-leg .v{font-variant-numeric:tabular-nums;font-weight:600}
svg .ax line,svg .ax path{stroke:var(--line-2)}
svg .grid line{stroke:var(--line)}
.mapa{position:relative;min-width:0}
.mapa svg{display:block;width:100%;background:var(--surface)}
.mapa .zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.mapa .zoom button{width:30px;height:30px;border:1px solid var(--line-2);background:var(--surface);border-radius:5px;cursor:pointer;font-size:16px;line-height:1}
.mapa .dica-zoom{font-size:12px;color:var(--muted);margin-top:4px}

/* tooltip */
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.4;padding:7px 9px;border-radius:5px;max-width:min(320px,90vw);box-shadow:0 4px 14px rgba(0,0,0,.18);opacity:0;transition:opacity .08s}
#tip.on{opacity:1}
#tip b{font-weight:600}

/* índice */
.indice-leg{font-size:13.5px;color:var(--ink-2);margin-top:6px}
.idx-grupos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:10px}
.idx-g{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.idx-g h3{font-size:14px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.idx-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit;align-items:start}
.idx-row:first-of-type{border-top:0}
.idx-row:hover .t{color:var(--accent)}
.idx-row .t{font-weight:600;font-size:14px}
.idx-row .f{font-size:13px;color:var(--ink-2);margin-top:2px}
.idx-row .p{font-size:12.5px;color:var(--ink-2);margin-top:3px;font-style:italic}
.idx-row .ar{color:var(--muted);margin-top:2px}
.lacunas{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.lacunas h3{font-size:15px;font-weight:600}
.lacunas ul{margin:8px 0 0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.lista-fl{display:grid;gap:4px}
.diagrama{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.diagrama .cx{border:1px solid var(--line-2);border-radius:5px;padding:8px 10px;background:var(--surface-2);text-align:center;min-width:0}
.diagrama .cx b{display:block;font-size:18px}
.diagrama .op{color:var(--muted);font-size:18px}
details.rec-d summary{cursor:pointer;font-weight:600;font-size:14px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-size:13.5px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv .stc{white-space:normal}
@media (max-width:480px){.kv{grid-template-columns:minmax(0,1fr)}.kv dd{margin-bottom:6px}}
.ficha{border:1px solid var(--accent);border-radius:var(--r);padding:14px;background:var(--surface)}
.ficha h4{font-size:16px}
.ok-ic{color:var(--st-good)}
footer.rod{border-top:1px solid var(--line);padding-block:16px 28px;font-size:12.5px;color:var(--muted);margin-top:30px}
.carga{position:fixed;left:0;right:0;top:0;height:3px;z-index:70;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:carga 1s linear infinite;display:none}
.carga.on{display:block}
@keyframes carga{from{background-position:-40% 0}to{background-position:140% 0}}

/* Responsivo */
@media (max-width:1099px){
  .fgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .evid{grid-template-columns:minmax(0,1fr)}
  .idx-grupos{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:699px){
  body{font-size:14.5px}
  .filtros{padding:10px}
  .filtros summary{display:flex;justify-content:space-between}
  .filtros:not([open]) .fbody{display:none}
  .filtros[open] summary{margin-bottom:10px}
  .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .regua .bl{padding:10px 8px}
  .regua .k{font-size:19px}
  .jornada{grid-template-columns:repeat(2,minmax(0,1fr))}
  .jornada button{border-left:0;border-top:1px solid var(--line)}
  .jornada button:nth-child(even){border-left:1px solid var(--line)}
  .jornada button:nth-child(-n+2){border-top:0}
  .filtros summary{min-height:44px;align-items:center}
  .resp{grid-template-columns:minmax(0,1fr)}
  .resp .principal{text-align:left}
  .duo{grid-template-columns:minmax(0,1fr)}
  .bars{grid-template-columns:minmax(70px,38%) minmax(0,1fr) max-content}
  .cartao{padding:14px 12px}
  .quadro{padding:10px}
  .resp .frase{font-size:15px}
}
@media (max-width:479px){nav.abas button .qs{display:none}}
@media (max-width:360px){.regua .k{font-size:16.5px}.regua .bl{padding:10px 6px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (forced-colors:active){.bars .br,.st100 > div{border:1px solid CanvasText}}

nosa',venosa:'Venosa',sorologia:'Sorologia',cronico:'Crônico',cronica:'Crônica',renal:'Renal',terapeutico:'Terapêutico',pacientes:'Pacientes',paciente:'Paciente',transito:'Trânsito',treinamento:'Treinamento',ate:'até',nao:'não',hepatite:'Hepatite',infeccao:'Infecção',insuficiencia:'Insuficiência',hipertensao:'Hipertensão',diabetes:'Diabetes',nefropatia:'Nefropatia',glomerulonefrite:'Glomerulonefrite',policistico:'Policístico',ignorado:'Ignorado',informacao:'Informação',acesso:'Acesso',vascular:'Vascular',temporario:'Temporário',permanente:'Permanente',duplo:'Duplo',lumen:'Lúmen',tunelizado:'Tunelizado'};

const tc0=s=>String(s||'').toLowerCase().replace(/(^|[\s\-(/])([a-zà-ú])/g,(m,a,b)=>a+b.toUpperCase()).replace(/\b(De|Da|Do|Das|Dos|E|Em|Com|Por|Para|Sem|No|Na|Nos|Nas|Ao|Ou)\b/g,w=>w.toLowerCase());
const tc=s=>tc0(s).replace(/[A-Za-zÀ-ú]+/g,w=>{const l=w.toLowerCase(); if(SIGLA.has(l)) return w.toUpperCase(); const a=ACENTO[l]; if(a&&a!==w&&!/[À-ú]/.test(w)) return w[0]===w[0].toUpperCase()?a[0].toUpperCase()+a.slice(1):a; return w}).replace(/\bDPA ?\/ ?DPAC\b/g,'DPA/DPAC').replace(/^./,c=>c.toUpperCase());

/* ======================= glossário ======================= */
const GLOS={
  'APAC':'Autorização de Procedimento Ambulatorial de Alta Complexidade. Na diálise é renovada todo mês; uma pessoa pode ter mais de uma APAC no mês, e uma mesma APAC pode vir em mais de uma linha quando traz também a cobrança de uma competência anterior.',

const D={}; const LOADS={};
function decode(d){
  if(!d||!d.cols) return d;
  const dic=d.dict||{}, cols=d.cols, cd=cols.map(c=>dic[c]||null), n=cols.length;
  const out=new Array(d.rows.length);
  for(let i=0;i<d.rows.length;i++){const r=d.rows[i],o={};for(let j=0;j<n;j++){let v=r[j];if(cd[j]&&v!=null)v=cd[j][v];o[cols[j]]=v}out[i]=o}
  const ex={};for(const k in d) if(!['cols','rows','dict'].includes(k)) ex[k]=d[k];
  out.ex=ex; return out;
}
function load(n){
  if(!LOADS[n]) LOADS[n]=fetch('data/'+n+(n.startsWith('br_')?'.topojson':'.json')).then(r=>{if(!r.ok) throw new Error('Falha ao carregar '+n);return r.json()}).then(d=>{D[n]=n.startsWith('br_')?d:decode(d);return D[n]});
  return LOADS[n];
}

}

function terr(){
  if(S.cnes) return {nivel:'CNES',cod:S.cnes};

  if(S.macro) return {nivel:'MACRO',cod:S.macro};
  if(S.uf) return {nivel:'UF',cod:S.uf};
  return {nivel:'BR',cod:'BR'};
}
function chain(t=terr()){
  const out=[t]; let n=t.nivel,c=t.cod;
  const E=ix('estabelecimentos','cnes'),M=ix('dim_mun','mun'),RS=ix('dim_rs','rs'),MA=ix('dim_macro','macro');
  if(n==='CNES'){const e=E.get(c); if(e){out.push({nivel:'MUN',cod:e.mun}); n='MUN'; c=e.mun} else n='BR'}
  if(n==='MUN'){const m=M.get(c); if(m){out.push({nivel:'RS',cod:m.rs}); n='RS'; c=m.rs} else n='BR'}
  if(n==='RS'){const r=RS.get(c); if(r){out.push({nivel:'MACRO',cod:r.macro}); n='MACRO'; c=r.macro} else n='BR'}
  if(n==='MACRO'){const m=MA.get(c); if(m){out.push({nivel:'UF',cod:m.uf}); n='UF'; c=m.uf} else n='BR'}
  if(n==='UF') out.push({nivel:'BR',cod:'BR'});
  if(out[out.length-1].nivel!=='BR') out.push({nivel:'BR',cod:'BR'});
  return out;
}
function nome(nv,cod){
  if(nv==='BR') return 'Brasil';
  if(nv==='UF'){const u=ix('dim_uf','uf').get(cod); return u?u.uf_nome:cod}
  if(nv==='MACRO'){const m=ix('dim_macro','macro').get(cod); return m?macroNome(m):cod}
  if(nv==='RS'){const r=ix('dim_rs','rs').get(cod); return r?r.nome:cod}
  if(nv==='MUN'){const m=ix('dim_mun','mun').get(cod); return m?m.nome+' ('+m.uf+')':cod}
  if(nv==='CNES'){const e=ix('estabelecimentos','cnes').get(cod); return e?tc(e.nome)+' (CNES '+cod+')':cod}
  return cod;
}
function macroNome(m){let n=tc(m.nome).replace(/Macrorregiao/g,'Macrorregião').replace(/Saude/g,'Saúde').replace(/Unica/g,'Única'); if(!n.includes(' - '+m.uf)) n+=' ('+m.uf+')'; return n}

/* resolve(componente): lê a matriz de alcance e devolve nível usado + etiquetas */
function resolve(spec){
  const t=terr(); const ch=chain(t); let used=null;
  for(const c of ch){ if(spec.levels.includes(c.nivel) && (!spec.has||spec.has(c.nivel,c.cod))){used=c;break} }
  if(!used) used={nivel:'BR',cod:'BR'};
  const tags=[];
  if(used.nivel===t.nivel&&used.cod===t.cod) tags.push(tagRec());
  else tags.push({k:'acima',t:'dado do nível acima ('+nomeLongo(used.nivel,used.cod)+')',d:spec.why||('Este dado não existe para '+NIVTXT[t.nivel]+'; o quadro usa o nível acima.')});
  if(natGestAtivo()&&!spec.natGest) tags.push({k:'na',t:'não se aplica a este filtro',d:'Natureza jurídica e gestão só filtram os quadros calculados pelo serviço (por estabelecimento). Este quadro ignora esses filtros.'});
  if(S.mod&&spec.mod===false) tags.push({k:'na',t:'modalidade não se aplica',d:'Este dado não é separado por modalidade; o quadro mostra todas as modalidades.'});
  if(spec.ref&&S.mes!==REF) tags.push({k:'na',t:'fotografia de abr/2026',d:'Este dado existe só para o mês de referência (abr/2026) e não muda com o filtro de mês.'});
  return {...used,nome:nome(used.nivel,used.cod),nomeL:nomeLongo(used.nivel,used.cod),tags};
}

function servSeries(){

}

function tabela(el,{cols,rows,page=25,busca=false,ordem=null,clique=null,legenda=null}){
  let st={q:'',sk:ordem?ordem[0]:null,sd:ordem?ordem[1]:-1,p:0};
  el.innerHTML=(busca?`<input class="tsearch" type="search" placeholder="Buscar na tabela" aria-label="Buscar na tabela">`:'')+`<div class="tbl-wrap"><table>${legenda?`<caption class="sr">${esc(legenda)}</caption>`:''}<thead></thead><tbody></tbody></table></div><div class="tbl-dica" aria-hidden="true">${ICON.seta}deslize para o lado para ver mais colunas</div><div class="pager"></div>`;
  const th=$('thead',el),tb=$('tbody',el),pg=$('.pager',el);
  const tw=$('.tbl-wrap',el), dica=()=>$('.tbl-dica',el).classList.toggle('on',tw.scrollWidth>tw.clientWidth+2);
  if(window.ResizeObserver){const ro=new ResizeObserver(dica); ro.observe(tw); ro.observe($('table',el))}
  th.innerHTML='<tr>'+cols.map((c,i)=>`<th scope="col" class="${c.num?'n ':''}${c.nosort?'':'sortable'}" data-i="${i}" ${c.nosort?'':'tabindex="0"'}>${esc(c.l)}</th>`).join('')+'</tr>';
  const draw=()=>{
    let rs=rows; if(st.q){const q=norm(st.q); rs=rs.filter(r=>cols.some(c=>norm(c.txt?c.txt(r):r[c.k]).includes(q)))}
    if(st.sk!=null){const c=cols.find(c=>c.k===st.sk); const vf=c&&c.sv?c.sv:(r=>r[st.sk]); rs=[...rs].sort((a,b)=>{const x=vf(a),y=vf(b); if(x==null&&y==null) return 0; if(x==null) return 1; if(y==null) return -1; return (x<y?-1:x>y?1:0)*st.sd})}
    const np=Math.max(1,Math.ceil(rs.length/page)); if(st.p>=np) st.p=np-1;
    const sl=rs.slice(st.p*page,(st.p+1)*page);

function pickMeses(ms,xf,minPx,every){ const sel=[]; if(ms.includes(S.mes)) sel.push(S.mes);
  ms.forEach((d,i)=>{ if(d===S.mes||i%every!==0) return; if(sel.every(q=>Math.abs(xf(q)-xf(d))>=minPx)) sel.push(d) }); return sel }

/* ======================= mapas ======================= */
const GEO={};
/* a malha veio com anéis no sentido anti-horário (RFC 7946); o d3 espera horário: inverte quando a área passa de meia esfera */
function fixWind(f){ const g=f&&f.geometry; if(!g) return f; const rv=poly=>poly.map(r=>r.slice().reverse()); const big=poly=>d3.geoArea({type:'Polygon',coordinates:poly})>2*Math.PI;
  if(g.type==='Polygon'){ if(big(g.coordinates)) g.coordinates=rv(g.coordinates) } else if(g.type==='MultiPolygon') g.coordinates=g.coordinates.map(pl=>big(pl)?rv(pl):pl); return f }
function geoInit(){
  if(GEO.uf) return;
  GEO.uf=topojson.feature(D.br_uf,D.br_uf.objects.uf).features.map(fixWind);
  GEO.rs=topojson.feature(D.br_regioes_saude,D.br_regioes_saude.objects.regioes_saude).features.map(fixWind);
  const by=d3.group(D.br_regioes_saude.objects.regioes_saude.geometries,g=>g.properties.cod_macro_saude);
  GEO.macro=[...by].map(([k,gs])=>({type:'Feature',properties:{macro:k,uf:gs[0].properties.uf},geometry:topojson.merge(D.br_regioes_saude,gs)})).map(fixWind);
  GEO.ufBy=new Map(GEO.uf.map(f=>[f.properties.uf,f])); GEO.rsBy=new Map(GEO.rs.map(f=>[f.properties.cod_regiao_saude,f])); GEO.macroBy=new Map(GEO.macro.map(f=>[f.properties.macro,f]));
}
function geoMun(){ if(GEO.mun||!D.br_municipios) return; GEO.mun=topojson.feature(D.br_municipios,D.br_municipios.objects.municipios).features.map(fixWind); GEO.munBy=new Map(GEO.mun.map(f=>[f.properties.cod_ibge6,f])) }
function focoFeatures(){
  const t=terr(); const ch=chain(t);
  const rs=ch.find(c=>c.nivel==='RS'), ma=ch.find(c=>c.nivel==='MACRO'), uf=ch.find(c=>c.nivel==='UF');
  if(['RS','MUN','CNES'].includes(t.nivel)&&ma) return [GEO.macroBy.get(ma.cod)].filter(Boolean);
  if(t.nivel==='MACRO'&&uf) return [GEO.ufBy.get(uf.cod)].filter(Boolean);
  if(uf) return [GEO.ufBy.get(uf.cod)].filter(Boolean);
  return GEO.uf;
}
function selFeature(){
  const t=terr();
  if(t.nivel==='UF') return GEO.ufBy.get(t.cod); if(t.nivel==='MACRO') return GEO.macroBy.get(t.cod); if(t.nivel==='RS') return GEO.rsBy.get(t.cod);
  if(t.nivel==='MUN'&&GEO.munBy) return GEO.munBy.get(t.cod); return null;
}
function mapa(el,o){

function hashRead(){
  const h=decodeURIComponent(location.hash.slice(1)); if(!h) return null;
  const [a,...ps]=h.split(';'); let q=null;
  Object.assign(S,{uf:null,macro:null,rs:null,mun:null,cnes:null,nat:null,gest:null,mod:null,mes:REF,olhar:'serv'});
  if(/^q\d+$/i.test(a)){q=a.toUpperCase(); S.aba=QABA[q]||'perguntas'} else if(ABAS.some(x=>x.id===a)) S.aba=a;

function setS(patch,opts={}){

  else if('macro' in patch&&S.macro){const m=ix('dim_macro','macro').get(S.macro); if(m) S.uf=m.uf; S.rs=null;S.mun=null;S.cnes=null}

let FLUXO_TOP=150;
function fluxosQuadro(ev){
  const t=tt(); const RS=ix('dim_rs','rs'), MU=ix('dim_mun','mun'); let arcs=[], tagsF, titulo, outL=[], inL=[];
  const flRS=D.fluxos_rs.filter(f=>f.rs_r&&f.rs_r!==f.rs_e);
  const sel=t.nivel==='RS'?t.cod:null;
  if(t.nivel==='MUN'||t.nivel==='CNES'){
    const mun=t.nivel==='MUN'?t.cod:chain(t)[1].cod; const fm=(D.fluxos_mun||[]).filter(f=>f.mun_res!==f.mun_estab);
    const out=t.nivel==='MUN'?fm.filter(f=>f.mun_res===mun):[], inn=fm.filter(f=>f.mun_estab===mun);
    const pt=m=>{const x=MU.get(m); return x?[x.lon,x.lat]:null};
    outL=out.map(f=>({n:nome('MUN',f.mun_estab),v:f.pac,km:f.km})).sort((a,b)=>b.v-a.v); inL=inn.map(f=>({n:nome('MUN',f.mun_res),v:f.pac,km:f.km})).sort((a,b)=>b.v-a.v);
    arcs=[...out.map(f=>({from:pt(f.mun_res),to:pt(f.mun_estab),w:f.pac,color:'var(--flow-out)',tip:`<b>Saída</b>: ${esc(nome('MUN',f.mun_res))} → ${esc(nome('MUN',f.mun_estab))}<br>${N(f.pac)} pacientes · ${D1(f.km)} km`})),...inn.map(f=>({from:pt(f.mun_res),to:pt(f.mun_estab),w:f.pac,color:'var(--flow-in)',tip:`<b>Entrada</b>: ${esc(nome('MUN',f.mun_res))} → ${esc(nome('MUN',f.mun_estab))}<br>${N(f.pac)} pacientes · ${D1(f.km)} km`}))].filter(a=>a.from&&a.to);
    titulo=t.nivel==='CNES'?'Fluxos que chegam ao município do serviço':'Fluxos de pacientes do município (entrada e saída)';
    tagsF=t.nivel==='CNES'?[{k:'acima',t:'município do serviço ('+nome('MUN',mun)+')',d:'Para um estabelecimento, mostramos os fluxos que chegam ao município onde ele fica.'}]:[tagRec()];
  } else if(sel){
    const out=flRS.filter(f=>f.rs_r===sel), inn=flRS.filter(f=>f.rs_e===sel); const pt=c=>{const x=RS.get(c); return x?[x.lon,x.lat]:null};
    outL=out.map(f=>({n:nome('RS',f.rs_e),v:f.pac,km:f.km_medio})).sort((a,b)=>b.v-a.v); inL=inn.map(f=>({n:nome('RS',f.rs_r),v:f.pac,km:f.km_medio})).sort((a,b)=>b.v-a.v);
    arcs=[...out.map(f=>({from:pt(f.rs_r),to:pt(f.rs_e),w:f.pac,color:'var(--flow-out)',tip:`<b>Saída</b>: ${esc(nome('RS',f.rs_r))} → ${esc(nome('RS',f.rs_e))}<br>${N(f.pac)} pacientes (${N(f.pac_hd)} em HD) · ${D1(f.km_medio)} km em média`})),...inn.map(f=>({from:pt(f.rs_r),to:pt(f.rs_e),w:f.pac,color:'var(--flow-in)',tip:`<b>Entrada</b>: ${esc(nome('RS',f.rs_r))} → ${esc(nome('RS',f.rs_e))}<br>${N(f.pac)} pacientes · ${D1(f.km_medio)} km em média`}))].filter(a=>a.from&&a.to);
    titulo='Fluxos da região de saúde: residentes que saem e pacientes de fora que chegam'; tagsF=[tagRec()];
  } else {
    const inT=f=>t.nivel==='BR'||inTerrRS(f.rs_r)||inTerrRS(f.rs_e);
    const fl=flRS.filter(inT).sort((a,b)=>b.pac-a.pac).slice(0,FLUXO_TOP); const pt=c=>{const x=RS.get(c); return x?[x.lon,x.lat]:null};
    arcs=fl.map(f=>({from:pt(f.rs_r),to:pt(f.rs_e),w:f.pac,color:'var(--flow-out)',tip:`${esc(nome('RS',f.rs_r))} → ${esc(nome('RS',f.rs_e))}<br>${N(f.pac)} pacientes (${N(f.pac_hd)} em HD) · ${D1(f.km_medio)} km em média`})).filter(a=>a.from&&a.to);
    outL=fl.map(f=>({n:nome('RS',f.rs_r)+' → '+nome('RS',f.rs_e),v:f.pac,km:f.km_medio}));
    titulo=`Fluxos entre regiões de saúde · os ${FLUXO_TOP} maiores; selecione uma região para ver todos`; tagsF=resolve({levels:['BR','UF','MACRO'],ref:true,mod:false}).tags;

    nota:'Regra R2: cada fluxo liga o município de residência ao município do estabelecimento. A soma dos fluxos para fora da região dá 14.637 pacientes, 3 a mais que os 14.634 do indicador, porque 3 pacientes têm residência sem região e ficam fora do indicador.',
    table:()=>({cols:[{k:'tipo',l:'Sentido'},{k:'n',l:'Origem ou destino'},{k:'v',l:'Pacientes',num:true,f:N},{k:'km',l:'km',num:true,f:v=>D1(v)}],rows:[...outL.map(x=>({...x,tipo:sel||t.nivel==='MUN'?'saída':'par'})),...inL.map(x=>({...x,tipo:'entrada'}))],busca:true})});
  if(isMob()){
    const dv=document.createElement('div'); dv.className='duo'; q.body.appendChild(dv);
    const L=(tt2,arr,c)=>{const d=document.createElement('div'); d.innerHTML=`<div style="font-weight:600;font-size:13px;margin-bottom:4px">${tt2}</div>`; dv.appendChild(d); if(arr.length) barras(d,arr.slice(0,12).map(x=>({label:x.n,v:x.v,color:c}))); else vazioMsg(d,'Nenhum fluxo.')};

  } else {
    const ends=arcs.flatMap(a=>[a.from,a.to]); const foc=ends.length&&(sel||t.nivel==='MUN'||t.nivel==='CNES')?[...focoFeatures(),{type:'Feature',geometry:{type:'MultiPoint',coordinates:ends}}]:null;

  }
}

function faixaOcup(el,c){

    svg.append('circle').attr('cx',xx).attr('cy',yb).attr('r',6).style('fill','var(--c1)').style('stroke','var(--surface)').style('stroke-width',2);

}

  const q5=quadro(ev,{full:true,title:'Completude do envio por UF e mês (APACs frente à mediana dos 6 meses anteriores)',tags:[{k:'filtrado',t:'todas as UFs',d:''}],unit:'razão APACs do mês ÷ mediana de 6 meses',nota:'Abr/2026 é a referência: último mês de processamento com APAC completa nas 27 UFs. Nele, só a Produção Ambulatorial (sessões) do Amapá ficou abaixo do esperado. Em mai e jun/2026 o Maranhão perdeu cerca de metade das APACs, e jul/2026 está incompleto em várias UFs. Células com contorno e "!" estão marcadas como envio incompleto suspeito.'});
  heatCompl(q5.body);
  const q6=quadro(ev,{full:true,title:'Conciliação com o TABNET',tags:[{k:'filtrado',t:'Brasil',d:''}],nota:'9 controles com diferença zero; o SIH fica 0,41% acima, dentro da tolerância de 0,5%.'});
  tabela(q6.body,{page:12,cols:[{k:'controle',l:'Controle',h:x=>esc(x.controle).replace('AIH tipo 1',g('AIH tipo 1')).replace('(1001 a 1004)','('+g('equipamentos 1001 a 1004','1001 a 1004')+')')},{k:'modelo_total',l:'Este painel',num:true,h:x=>/valor/i.test(x.controle)?R(x.modelo_total):N(x.modelo_total)},{k:'tabnet_total',l:'TABNET',num:true,h:x=>/valor/i.test(x.controle)?R(x.tabnet_total):N(x.tabnet_total)},{k:'diferenca_pct',l:'Diferença',num:true,f:v=>D1(v,2)+'%'},{k:'ok',l:'Situação',h:x=>x.ok?`<span class="ok-ic">${ICON.ok}</span> dentro da tolerância`:'fora'}],rows:META.controles_externos_tabnet});
  const q7=quadro(ev,{full:true,title:'Checagens internas',tags:[{k:'filtrado',t:'Brasil',d:''}],nota:`${N(META.checagens.filter(c=>c.ok).length)} de ${N(META.checagens.length)} checagens automáticas do modelo passaram. A tabela traz as principais em linguagem simples; o registro técnico completo fica no detalhe abaixo.`});
  const nR=nr; const CH=[
   ['Registros repetidos removidos dos arquivos de APAC','1.640 linhas duplicadas e 11 linhas com tipo de APAC 4 (os arquivos de tratamento usam os tipos 1 a 3) saíram antes de qualquer conta.'],
   ['Cada pessoa conta no máximo um óbito','De mai/2025 a abr/2026, 17.574 registros de óbito viraram 17.013 óbitos válidos, um por pessoa.'],
   ['Pacientes nunca passam do número de APACs','Abr/2026: 137.500 pacientes, 139.971 linhas de APAC e 139.407 autorizações distintas. As 564 linhas a mais vêm de 491 autorizações que aparecem mais de uma vez no mês, cada vez com outra competência (cobrança de mês anterior). Em nenhum dos 739 estabelecimentos há mais pacientes do que autorizações.'],
   ['A soma das UFs fecha com o Brasil','Pacientes (137.500), linhas de APAC (139.971), sessões (1.643.679) e valor aprovado (R$ 427,0 mi) fecham exatamente em abr/2026.'],
   ['Sessões por paciente de hemodiálise ficam no esperado','12,3 sessões por paciente no mês, contando as sessões realizadas no próprio mês; 0,7% das sessões cobradas em abr/2026 são de meses anteriores.'],
   ['Estabelecimentos com razão sessões por paciente fora do normal','15 estabelecimentos com sessões faturadas por outro CNES ficam marcados; a razão só é usada para região, UF e Brasil.'],
   ['Fluxos residência → serviço fecham com o total','Os pares de municípios somam 137.500 pacientes, o total do mês.'],
   ['Conferência com o TABNET','9 de 10 controles com diferença zero; o SIH fica 0,41% acima, dentro da tolerância de 0,5%.']];
  q7.body.insertAdjacentHTML('beforeend',`<div class="tbl-wrap"><table><thead><tr><th>O que conferimos</th><th>Resultado</th><th>Situação</th></tr></thead><tbody>${CH.map(([a,b])=>`<tr><td>${esc(a)}</td><td>${esc(b)}</td><td style="white-space:nowrap"><span class="ok-ic">${ICON.ok}</span> conferido</td></tr>`).join('')}</tbody></table></div><details class="rec-d" style="margin-top:8px"><summary>Registro técnico completo (${N(META.checagens.length)} checagens, como saem do modelo)</summary><ul style="margin:8px 0 0;padding-left:0;list-style:none;display:grid;gap:4px;font-size:13px">${META.checagens.map(c=>`<li style="display:flex;gap:6px"><span class="${c.ok?'ok-ic':''}" aria-label="${c.ok?'ok':'falhou'}">${c.ok?ICON.ok:ICON.x}</span><span>${esc(c.checagem)} <span class="muted">(${esc(typeof c.detalhe==='number'?D1(c.detalhe,2):ptNum(c.detalhe))})</span></span></li>`).join('')}</ul></details>`);
  const q8=quadro(ev,{full:true,title:'O que mudou na revisão de 23/10/2026',tags:[{k:'filtrado',t:'modelo',d:''}]});
  q8.body.innerHTML=`<details class="rec-d"><summary>${META.revisao_23out2026.length} itens revisados (abrir)</summary><div style="margin-top:8px"></div></details>`;
  tabela($('details div',q8.body),{page:25,cols:[{k:'item',l:'Item'},{k:'status',l:'Situação'},{k:'como',l:'Como'}],rows:META.revisao_23out2026});
  const q9=quadro(ev,{full:true,title:'Fontes e períodos',tags:[{k:'filtrado',t:'modelo',d:''}]});
  q9.body.innerHTML=`<dl class="kv">${Object.entries(META.periodos).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl><p class="nota">Endereços públicos: <a href="https://datasus.saude.gov.br/informacoes-de-saude-tabnet/" target="_blank" rel="noopener">TABNET/DATASUS ${ICON.ext}</a> · <a href="https://cnes.datasus.gov.br/" target="_blank" rel="noopener">CNES ${ICON.ext}</a> · arquivos em ftp.datasus.gov.br/dissemin/publicos (SIASUS, SIHSUS, SIM, CNES).</p>`;
  const q10=quadro(ev,{full:true,title:'Glossário',tags:[]});
  q10.body.innerHTML=`<dl class="kv">${Object.entries(GLOS).map(([k,v])=>`<dt><b>${esc(k)}</b></dt><dd>${esc(v)}</dd>`).join('')}</dl>`;

function ptNum(t){ return String(t).replace(/\d[\d,]*\.?\d*/g,m=>{ if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(m)||/^\d+\.\d+$/.test(m)){const v=+m.replace(/,/g,''); const d=(m.split('.')[1]||'').length; return nfd(d).format(v)} return m }) }
function heatCompl(el){
  const ufs=[...new Set(D.completude.map(x=>x.uf))].sort(), ms=MESES;
  const cw=26,ch=16,l=34,tp=22; const W=l+ms.length*cw+4, H=tp+ufs.length*ch+4;
  const wrap=document.createElement('div'); wrap.className='tbl-wrap'; el.appendChild(wrap);
  const svg=d3.select(wrap).append('svg').attr('width',W).attr('height',H).attr('viewBox',`0 0 ${W} ${H}`).attr('role','img').attr('aria-label','Completude por UF e mês').style('display','block');
  const col=v=>!ok(v)?'var(--empty)':v<0.7?'var(--d-pos2)':v<0.9?'var(--d-pos1)':v<=1.1?'var(--d-mid)':'var(--d-neg1)';
  const hx=m=>l+ms.indexOf(m)*cw+cw/2; const sv0=S.mes; S.mes=REF; const hl=pickMeses(ms,hx,2*cw,3); S.mes=sv0;
  hl.forEach(m=>svg.append('text').attr('x',hx(m)).attr('y',14).attr('text-anchor','middle').text(mls(m)).style('font-size','11px').style('font-weight',m===REF?'600':null));
  ufs.forEach((u,j)=>{svg.append('text').attr('x',l-6).attr('y',tp+j*ch+ch/2+4).attr('text-anchor','end').text(u).style('font-size','10.5px');
    ms.forEach((m,i)=>{const r=D.completude.find(x=>x.uf===u&&x.mes===m); const v=r&&r.apac_vs_mediana_6m;
      const gx=svg.append('g').attr('transform',`translate(${l+i*cw},${tp+j*ch})`);
      gx.append('rect').attr('width',cw-2).attr('height',ch-2).attr('rx',2).style('fill',PROV.has(m)&&!(r&&r.suspeito_incompleto)?'url(#hatch)':col(v)).style('stroke',r&&r.suspeito_incompleto?'var(--ink)':'none').style('stroke-width',1.5);
      if(r&&r.suspeito_incompleto) gx.append('text').attr('x',(cw-2)/2).attr('y',ch-5).attr('text-anchor','middle').text('!').style('fill','var(--ink)').style('font-weight','700');
      gx.on('mousemove',ev=>tipShow(ev,`<b>${u} · ${ml(m)}</b><br>${r?N(r.apac)+' APACs':'sem dado'}${ok(v)?'<br>'+D1(v,2)+' × a mediana de 6 meses':''}${r&&r.suspeito_incompleto?'<br>Envio incompleto suspeito':''}${r&&ok(r.pct_cns_valido)?'<br>CNS válido em '+D1(r.pct_cns_valido)+'% das APACs':''}`)).on('mouseleave',tipHide)})});
  el.insertAdjacentHTML('beforeend',`<div class="leg">${legItem('var(--d-pos2)','abaixo de 0,7')}${legItem('var(--d-pos1)','0,7 a 0,9')}${legItem('var(--d-mid)','0,9 a 1,1')}${legItem('var(--d-neg1)','acima de 1,1')}${legItem('var(--empty)','sem base de comparação')}${legItem('var(--surface)','provisório','h')}</div>`);
}

/* ======================= início ======================= */
async function iniciar(){
  /* primeira tela rápida: resumo e régua R1 com o mínimo de arquivos, antes do resto */
  try{ await need(['meta','dim_uf','dim_macro','dim_rs','serie_recorte','completude']);
    META=D.meta; PROV=new Set(META.mes_provisorio); MESES=[...new Set(D.serie_recorte.filter(r=>r.nivel==='BR').map(r=>r.mes))].sort();
    hashRead(); if(!precisaEstab()&&!S.mun&&!S.cnes&&S.olhar==='serv'){ try{ topo() }catch(e){} } }catch(e){}
  try{ await need(NEEDS.base) }catch(err){ $('#main').innerHTML=`<div class="vazio-msg">Não foi possível carregar os dados (${esc(err.message)}). Abra o painel por um servidor local, por exemplo "python3 -m http.server", e recarregue.</div>`; return }
  META=D.meta; PROV=new Set(META.mes_provisorio);
  MESES=[...new Set(D.serie_recorte.filter(r=>r.nivel==='BR').map(r=>r.mes))].sort();
  const q=hashRead();
  if(isMob()) $('#filtros').open=false;
  filtrosBind(); render(q?{scrollTo:q}:{});
  window.addEventListener('hashchange',()=>{const q2=hashRead(); render(q2?{scrollTo:q2}:{soft:true})});
  let rt; let lw=window.innerWidth; window.addEventListener('resize',()=>{clearTimeout(rt); rt=setTimeout(()=>{if(Math.abs(window.innerWidth-lw)>40){lw=window.innerWidth; render({soft:true})}},250)});
}
iniciar();
</script>
